name:                hackage-api
version:             0.1.0.0
github:              "tweag/hackage-server-v3"
license:             BSD-3-Clause
author:              "Tweag"
maintainer:          "sandy.maguire@tweag.io"
copyright:           "2026 Tweag"
language:            GHC2024

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/tweag/hackage-server-v3#readme>

dependencies:
- base >= 4.7 && < 5
- Cabal-syntax
- QuickCheck
- aeson
- base64-bytestring
- bytestring
- containers
- crypton
- ede
- filepath
- hashable
- http-client
- http-media
- http-reverse-proxy
- http-types
- lens
- mime-types
- monoidal-containers
- mtl
- quickcheck-text
- rel8
- resourcet
- servant
- servant-ede
- servant-server
- text
- time
- transformers
- wai
- warp

# for schema-profunctor
- vector
- profunctors
- bifunctors
- comonad
- openapi3

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wpartial-fields
- -Wredundant-constraints

default-extensions:
- DerivingVia
- DeriveAnyClass
- GeneralizedNewtypeDeriving

library:
  source-dirs: src

tests:
  tests:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - hackage-api
    - hspec
    - hspec-discover
    - hspec-wai

