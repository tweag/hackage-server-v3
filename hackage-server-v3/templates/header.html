<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css?family=PT+Sans:400,400i,700" rel="stylesheet">
<link rel="stylesheet" href="/static/hackage.css" type="text/css" />
<link rel="icon" type="image/png" href="/static/favicon.png" />
<link rel="search" type="application/opensearchdescription+xml" title="Hackage" href="/packages/opensearch.xml" />
<title>{{ title }} | Hackage</title>
<style type="text/css">
.comma-sep {
  display: inline-flex;
  align-items: baseline;
  list-style: none;
  padding: 0;
  margin: 0;
}

.comma-sep li {
  display: inline;
}

.comma-sep li:after {
  content: ", ";
}

.comma-sep li:last-child:after {
    content: "";
}

</style>
</head>

<body>

<div id="page-header">

  <a class="caption" href="/">Hackage :: [Package]</a>

<ul class="links" id="page-menu">

    <li>
      <form action="/packages/search" method="get" class="search">
        <button type="submit">Search&nbsp;</button>
        <input type="text" name="terms" />
      </form>
    </li>

    <li><a href="/packages/browse">Browse</a></li>

    <li><a href="/packages/recent">What's new</a></li>

    <li><a href="/upload">Upload</a></li>

    <li><a href="/accounts">User accounts</a></li>
    $if(deauthPack)$
      <li><a title="If authenticated" href="/packages/deauth">Logout</a></li>
    $elseif(deauthAdmin)$
      <li><a title="If authenticated" href="/admin/deauth">Logout</a></li>
    $elseif(deauthUser)$
      <li><a title="If authenticated" href="./deauth">Logout</a></li>
    $endif$

</ul>

</div>
<div id="content">
